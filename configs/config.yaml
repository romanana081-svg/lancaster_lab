# config.yaml — ALL parameters. No hard-coded paths, thresholds, or concept IDs in code.
#
# Every value here is a *scientific choice*, not an implementation detail. A threshold buried in
# code is a choice nobody can review and nobody can tell you changed. If you find yourself typing a
# number into a function, it belongs here instead (loop.md, rule 2).
#
# Entries marked `# FROZEN:` must not change once outcomes have been examined — changing them after
# seeing results is the garden of forking paths, and it invalidates the p-value regardless of what
# the number says (Q-G1, Q-G2, Q-S3).

schema_version: 1

# ---------------------------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------------------------
# In the All of Us Workbench these come from injected env vars. Offline they point at fixture/.
# Code reads the env var first and falls back to the fixture — never hard-code a gs:// path.
environment:
  workspace_cdr:     ${WORKSPACE_CDR}       # BigQuery CDR dataset (Workbench only)
  workspace_bucket:  ${WORKSPACE_BUCKET}    # GCS bucket           (Workbench only)
  google_project:    ${GOOGLE_PROJECT}      # BigQuery billing project
  owner_email:       ${OWNER_EMAIL}
  offline_fixture:   fixture/db/aou_fixture.duckdb
  offline_bucket:    fixture/bucket

# ---------------------------------------------------------------------------------------------
# Cohort  (DESIGN §2 — two of these are NOT settled; see the status notes)
# ---------------------------------------------------------------------------------------------
cohort:
  # The gate applied by all 13 generated queries. A-007: unverified against the published
  # CDR v7 srWGS count (~245,394).
  require_srwgs: true                       # has_whole_genome_variant = 1 in cb_search_person

  # SETTLED by the advisor, D-013 / D-015.
  age_min: 30                               # per the PREVENT equations
  age_max: 79                               # Q-S7 RESOLVED. PREVENT is validated on 30-79; above 79
                                            # the model would be extrapolated outside its fitted range.

  # COMPLETE-CASE. A participant is eligible ONLY if every PREVENT input is present; incomplete
  # participants are EXCLUDED, not imputed (D-013).
  #
  # !! This is not a neutral filter (A-015, RISK 🔴). Having lipids AND a blood pressure AND a
  # creatinine AND a smoking status recorded is a marker of SUSTAINED HEALTHCARE CONTACT. The excluded
  # skew toward sparse-EHR participants, which tracks access, socioeconomic status, and ancestry --
  # so cohort membership becomes entangled with the very genetics we intend to study (A-011).
  # MEASURE IT: the attrition table must compare included vs excluded (T-002).
  require_complete_prevent_panel: true

  # PREVENT is a PRIMARY PREVENTION model -- it is undefined for people who already have ASCVD.
  # Including prevalent cases inflates apparent prediction accuracy (DESIGN §2).
  exclude_prior_ascvd: true

  # Event-time anchoring is DEFERRED to a later goal (D-015, Q-S6, T-019). For now: include the
  # events, and KEEP THE TIMING -- every value and every event carries its own date, so that any
  # anchoring scheme remains possible later.
  #
  # !! NO ANCHOR IS APPLIED YET, AND THAT IS DELIBERATE. The deferral is only safe while it stays
  # true. If an extractor quietly takes each person's EARLIEST value (the notebook's habit, A-001),
  # a de-facto anchor creeps in: cases and non-cases end up anchored differently, and every predictor
  # looks stronger than it is WITH NO BUG APPEARING ANYWHERE. Hence `anchor: none`.
  anchor: none                              # none | first_complete_panel | landmark   (T-019 decides)
  retain_all_dates: true                    # non-negotiable while anchor: none

  # OPEN — Q-A2. Absence of an EHR code is treated as absence of disease (A-006), and that
  # assumption is weakest for people who barely appear in the EHR.
  min_followup_years: UNRESOLVED
  min_visits: UNRESOLVED

# ---------------------------------------------------------------------------------------------
# Outcome  (SETTLED by the advisor — D-014)
# ---------------------------------------------------------------------------------------------
# ASCVD from BOTH billing/diagnosis (ICD) and procedure (CPT) codes. Codes are RESOLVED through the
# All of Us vocabulary rather than used as opaque IDs, so that event timing and disease type/stage can
# be read off them. The definition itself is in a file you can actually read:
outcome:
  definition: ascvd_icd_and_cpt
  code_map: configs/ascvd_codes.yaml        # <- the outcome, in reviewable form
  sources: [condition_occurrence, procedure_occurrence]

  # ADVISOR DECISION 2026-07-31 (D-016): ALL THREE classes count as incidence of ASCVD — a chronic
  # ASCVD diagnosis, an acute event, and a revascularisation alike. Q-A1 is resolved in favour of
  # inclusion.
  incident_event_classes: [acute_event, chronic_disease, revascularisation]

  # ...but the classes stay separable and BOTH definitions get reported (Q-A1's original point stands
  # for the sensitivity analysis, and there is a second reason now). The published PREVENT rate is a
  # HARD-outcome rate — nonfatal MI, nonfatal stroke, CV death — so ONLY `acute_event` is comparable
  # to it. Reporting the broad outcome against the literature band would look like a 3-5x excess of
  # events when it is really a different outcome definition.
  include_revascularisation: report_both
  sensitivity_event_classes: [acute_event]        # the literature-comparable hard outcome

  # ADVISOR DECISION 2026-07-31 (D-017): a participant counts only if their complete PREVENT panel
  # predates the event by at least this many days. Stops the panel being measured BY the event —
  # lipids and a BP drawn during an MI admission are a consequence of the disease, not a prediction
  # of it. Implemented as a SYMMETRIC blanking window (nobody is at risk until baseline + this many
  # days), because removing those events without also removing their person-time biases every
  # incidence rate downward with no visible bug. See ascvd_status_at().
  min_days_panel_to_event: 30

  horizon_years: 10                         # PREVENT provides both 10y and 30y
  competing_risk: non_ascvd_death           # Fine-Gray sensitivity analysis (T-010)

# ---------------------------------------------------------------------------------------------
# PREVENT inputs  (D-004, D-013)
# ---------------------------------------------------------------------------------------------
# The panel. D-013 excludes anyone missing ANY of these, so THE COMPLETENESS RATE IS THE SAMPLE SIZE
# (A-016). Count it before building anything else -- T-017.
prevent_inputs:
  required: [age, sex, total_cholesterol, hdl_c, systolic_bp, antihypertensive_use,
             diabetes, current_smoking, egfr, bmi]

  # eGFR is DERIVED, not measured: serum creatinine -> CKD-EPI 2021.
  # Use the RACE-FREE 2021 equation. The older race-adjusted version would smuggle race back into a
  # model that was deliberately built without it (D-004) -- a real scientific error, not a nit.
  egfr_equation: ckd_epi_2021_race_free

  # Extended PREVENT adds HbA1c / UACR / social deprivation index. Every extra input SHRINKS THE
  # COHORT under complete-case (D-013), so which variant we use is a real decision -- H-002.
  model_variant: UNRESOLVED                 # base | extended

# ---------------------------------------------------------------------------------------------
# Physiologic bounds  (A-004)
# ---------------------------------------------------------------------------------------------
# Values outside these are treated as data-entry errors. Inherited from the notebook — and one of
# them is actively dangerous for this study.
bounds:
  ldl_mgdl:   { min: 1,  max: 1000 }
  trig_mgdl:  { min: 1,  max: 1000 }
  bmi_kgm2:   { min: 14, max: 60 }

  # !! The notebook additionally caps LDL at < 400 mg/dL. DO NOT PORT THAT BOUND UNEXAMINED.
  # Untreated familial hypercholesterolemia carriers routinely exceed 400 mg/dL, so the cap
  # systematically deletes the strongest rare-variant carriers — precisely the people this study
  # exists to detect. A-004 (🔴), revisit in T-003.
  ldl_upper_cap_mgdl: REVISIT               # notebook value: 400

# ---------------------------------------------------------------------------------------------
# Units  (A-003)
# ---------------------------------------------------------------------------------------------
# The notebook filters `unit_source_value == 'mg/dL'` — case-sensitive and exact. A person whose
# only lipid panel is recorded as `mg/dl` vanishes with no warning (fixture defect A1,
# participant 1000021). Normalise; do not discard.
units:
  normalise_case: true                      # not yet implemented — T-003
  strip_whitespace: true
  accepted_lipid_units: ['mg/dL']
  convert_mmol_l: true                      # convert rather than drop
  mmol_l_to_mgdl_cholesterol: 38.67
  mmol_l_to_mgdl_triglycerides: 88.57

# ---------------------------------------------------------------------------------------------
# Record selection  (A-001, A-002)
# ---------------------------------------------------------------------------------------------
record_selection:
  # The notebook takes each person's EARLIEST record. For an aetiological LDLR study that was
  # defensible. For a PREDICTION study it is probably WRONG: the correct anchor is the value at
  # the index date. A-001 (🔴), resolve with Q-S1 in T-003.
  strategy: REVISIT                         # notebook value: earliest

  # A-002 was REFUTED as safe: `distinct(person_id, .keep_all = TRUE)` over SQL with no ORDER BY
  # keeps an arbitrary row, so same-day duplicates made results non-reproducible between runs.
  # SETTLED by D-009 (2026-07-14): take the MEAN of same-day values. Same-day repeats are repeated
  # measurements of one quantity, so averaging uses all of them and smooths assay error. min/max were
  # rejected for imposing a directional bias on the study's key exposure.
  same_day_tiebreak: mean                   # mean | median | min | max | first(legacy, arbitrary)

# ---------------------------------------------------------------------------------------------
# Genetics  (D-008 — PROPOSED, not accepted)
# ---------------------------------------------------------------------------------------------
# FROZEN BEFORE OUTCOMES ARE EXAMINED. These are the forking-paths parameters (Q-G1, Q-G2).
genetics:
  gene_set_mode: UNRESOLVED                 # prespecified | exome_wide | hierarchical  (Q-G1)

  # The candidate pre-specified set. Confirmatory, well-powered, and it makes the positive
  # control in A-009 meaningful: LDLR burden MUST associate with LDL, or the pipeline is broken.
  prespecified_genes: [LDLR, APOB, PCSK9, LPA, APOA5, ANGPTL3, ANGPTL4]

  maf_threshold: UNRESOLVED                 # 0.01 (low-frequency) | 0.001 (rare)   (Q-G2)
  functional_mask: UNRESOLVED               # lof | lof_plus_damaging_missense | all_coding  (Q-G2)
  aggregation: burden                       # scalar burden for the offset model; SKAT-O for discovery

  ancestry_pcs: 10                          # A-011 — population stratification
  exclude_related: true

# ---------------------------------------------------------------------------------------------
# Statistics  (D-006, D-007)
# ---------------------------------------------------------------------------------------------
statistics:
  primary_model: M1                         # offset(PREVENT LP) + gamma * G ; test gamma = 0
  offset_variant: UNRESOLVED                # published_lp | recalibrated_lp | both  (Q-S2)

  # NRI is biased toward declaring improvement and is sensitive to these cut-points. Secondary
  # endpoint only (D-007). FROZEN: pre-specify before any outcome model is fitted (Q-S3).
  nri_thresholds: [0.05, 0.075, 0.20]

  check_proportional_hazards: true          # Q-S5 — genetic effects may be stronger at younger ages
  report: [discrimination, calibration, decision_curve, nri]

# ---------------------------------------------------------------------------------------------
# Literature benchmarks  (VALIDATION §1 layer 3 — the EXTERNAL ground truth)
# ---------------------------------------------------------------------------------------------
# Numbers taken from the PREVENT paper itself, so that "is our result plausible?" is answered against
# a citation instead of against intuition. Sourced 2026-07-30 from the OPEN full text at PMC10910659
# — the paper is not paywalled there, which an earlier session assumed it was (meeting.md §2).
#
# These are REFERENCE VALUES, not tunables. Do not edit them to make a run agree; if a run disagrees,
# that is the finding. Only the `plausible_band` is a judgment call, and its reasoning is spelled out.
literature:
  prevent_paper:
    citation: "Khan SS et al. Development and Validation of the AHA PREVENT Equations.
               Circulation. 2024;149(6):430-449"
    doi: 10.1161/CIRCULATIONAHA.123.067626
    open_full_text: PMC10910659

    # Cohort scale. derivation + validation = 6,612,004 people and 211,515 total CVD events, which
    # is exactly what the paper's abstract states — an arithmetic check that these were read right.
    # NB `n_participants`, not `n`. In YAML 1.1 a bare `n` key parses as the BOOLEAN false (n = no),
    # so `n: 3281919` silently becomes the key `FALSE`. Found the hard way, 2026-07-30.
    derivation: { n_participants: 3281919, mean_age: 52.6, pct_female: 56,
                  mean_followup_years_female: 4.8, mean_followup_years_male: 4.6,
                  events_cvd: 106661, events_ascvd: 66503 }
    validation: { n_participants: 3330085,
                  mean_followup_years_female: 5.0, mean_followup_years_male: 4.8,
                  events_cvd: 104854, events_ascvd: 67902 }

    # DERIVED from the counts above (events / (N x mean follow-up)). This is the number our observed
    # incidence gets compared against. Ages 30-79, primary prevention, mean age ~52-53.
    ascvd_rate_per_1000py:
      derivation_female: 3.60
      derivation_male:   5.23
      derivation_pooled: 4.30
      validation_pooled: 4.15
    cvd_rate_per_1000py:
      derivation_pooled: 6.90

    # Discrimination in external validation, base model, ASCVD — the target for T-007.
    c_statistic_ascvd: { female: 0.774, male: 0.736 }

  # The band we expect OUR observed acute-ASCVD rate to fall in, and why it is not just "4.2".
  # Our cohort is OLDER (median 58 vs the paper's mean ~52.6) and is selected on having a complete
  # lab panel, i.e. on sustained healthcare contact (A-015) — both push the true rate UP. Against
  # that, All of Us EHR capture is partial (care outside the contributing site is invisible, A-006),
  # which pushes the OBSERVED rate DOWN. The band is wide because both forces are real and unmeasured.
  #
  # This is a SMOKE ALARM, not a hypothesis test. Landing outside it means "find out why before
  # showing the curve", not "the study failed".
  #
  # !! THE BAND APPLIES TO THE ACUTE-ONLY OUTCOME. The published 4.15-4.30 counts hard events
  # (nonfatal MI, nonfatal stroke, CV death). Our PRIMARY outcome since D-016 is broader — chronic
  # ASCVD diagnoses and revascularisations count too — and a first-ever chronic IHD code is far more
  # common in EHR data than a first MI. Checking the broad outcome against this band would flag a
  # correct pipeline as contaminated. `check_incidence_vs_literature(outcome = "broad")` refuses the
  # comparison for exactly that reason.
  expected_ascvd_incidence:
    applies_to_outcome:          acute_event      # NOT the D-016 primary outcome
    plausible_band_per_1000py:   [4.0, 12.0]
    investigate_outside:         [2.0, 20.0]   # outside this, suspect a structural defect
    rationale_low:  "under-ascertainment: ICD10CM-only misses pre-2015 events; EHR capture gaps;
                     administrative censoring at the CDR cutoff inflates person-time (nobody is
                     censored at last contact), which dilutes the rate"
    rationale_high: "prevalent disease leaking into the at-risk set (pre-2015 ICD9 blindness hides
                     the prior event), chronic_disease codes counted as acute events, or the
                     CPT 929 over-capture (92950 CPR, 92960 cardioversion) inflating the numerator"

# ---------------------------------------------------------------------------------------------
# Output  (D-005 — immutable and versioned; a new version NEVER overwrites an old one)
# ---------------------------------------------------------------------------------------------
output:
  phenotype_version: 1
  phenotype_file: phenotypes_v{version}.parquet
  schema: configs/phenotype_schema.json
  overwrite: false                          # not a preference. a guarantee.
